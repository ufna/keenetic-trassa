# trassa rules: the default for a new installation.
#
# The first matching rule wins. Check a file with: trassa check <file>
# Everything here is commented out except "default direct": as it is, trassa changes nothing and
# the router routes all traffic as before. To enable an example, remove the "#" and the spaces
# before it.

# Exits. An exit is a named list of tunnels; the first live one is used. A tunnel is named by its
# firmware name (Wireguard0) or by its description in the firmware settings. Enable the exit once
# a VPN tunnel is set up on the router: every rule that sends traffic to "vpn" needs it.
#
#   exit vpn = Wireguard0

# Where everything that matches no rule goes. "direct" means as the router routes it: trassa does
# not touch such traffic at all.
default direct

# Rules: conditions, then "->" and the exit. For example, Telegram and Instagram through the VPN,
# Google directly:
#
#   telegram.org t.me telegram.me cdn-telegram.org   -> vpn
#   149.154.160.0/20 91.108.4.0/22 91.108.56.0/22    -> vpn      # Telegram's own addresses
#   instagram.com cdninstagram.com                   -> vpn
#   google.com *.google.com                          -> direct
#
# "google.com" alone already covers all its subdomains. "*.google.com" alone covers only the
# subdomains (mail.google.com, but not google.com itself), and "=google.com" only the name itself.
#
# More forms of conditions:
#
#   ~^cdn[0-9]+\.example\.net$ -> vpn     # a regular expression
#   example.org -> vpn strict             # never leaks: blocked while all tunnels of the exit are down
#   @lists/streaming.txt -> vpn           # conditions from a file in this directory, one per line
#   twitch.tv -> vpn for tv, phones       # only for the devices of these lists (see below)
#   reddit.com -> vpn for !office         # for every device except those of this list
#   ads.example.net -> none               # blocked: new connections to its addresses are refused
#   !*.ru -> vpn                          # everything except .ru; keep such a broad rule last
#
# Device lists for "for". A device is a name from the router's device list (in quotes if it has
# spaces), a MAC or an IPv4 address. Give listed devices a permanent address in the router's DHCP
# settings: trassa follows a device by its address.
#
#   device tv     = "Living room TV"
#   device phones = "Pixel", aa:bb:cc:dd:ee:ff
#   device office = 192.168.1.50
#
# Expectations: checked every time the file is checked, so a later edit cannot quietly break them.
#
#   test t.me = vpn
#   test mail.google.com = direct
