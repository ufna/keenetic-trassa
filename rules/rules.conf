# trassa rules: the default for a new installation.
# The first matching rule wins. Check a file with: trassa check <file>

# An exit is a list of firmware interfaces, the first live one is used. An interface is named
# by its firmware name (Wireguard0) or by its description in the firmware settings.
exit vpn = Wireguard0

# Where everything that matches no rule goes. direct means "as the router routes it":
# trassa does not touch such traffic at all.
default direct

# Rules: conditions -> exit [strict]. Examples (remove # to enable):
#
#   example.com -> vpn                    the domain and all its subdomains
#   =example.com -> vpn                   only this exact name
#   *.example.com -> vpn                  only the subdomains
#   ~^cdn[0-9]+\.example\.net$ -> vpn     a regular expression
#   !*.ru -> vpn                          everything except .ru
#   203.0.113.0/24 198.51.100.7 -> vpn    subnets and addresses
#   example.org -> vpn strict             blocked while all tunnels of the exit are down
#   @lists/streaming.txt -> vpn           conditions from a file in this directory
#
# Expectations, checked every time the file is checked:
#
#   test www.example.com = vpn
#   test example.net = direct
